<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="48%" stop-color="#D1D5DB"/>
      <stop offset="100%" stop-color="#71717A"/>
    </linearGradient>
    <linearGradient id="metalBorder" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.12)"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Deep Dark Background with Hairline Precision Border -->
  <rect width="48" height="48" rx="4" fill="#08080A"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="3.5" stroke="url(#metalBorder)" stroke-width="1"/>

  <!-- Micro-engineering Precision Dot Grid -->
  <rect x="8" y="8" width="3" height="3" fill="#4A4D55" opacity="0.6"/>
  <rect x="14" y="8" width="3" height="3" fill="#2E3036" opacity="0.5"/>
  <rect x="8" y="14" width="3" height="3" fill="#2E3036" opacity="0.5"/>

  <!-- Sharp Architectural "01" Monospace Type -->
  <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="url(#metalGrad)" text-anchor="middle" letter-spacing="-0.02em">01</text>
</svg>
