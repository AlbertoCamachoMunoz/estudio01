<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!--
  ==========================================================================
  LOGO ANTERIOR (PIXEL & WEB V1 - PRESERVADO POR SI SE REAPROVECHA):
  <rect width="40" height="40" rx="10" fill="#0B0F19"/>
  <rect x="1.5" y="1.5" width="37" height="37" rx="8.5" stroke="url(#pwGrad)" stroke-width="2"/>
  <rect x="8" y="8" width="6" height="6" rx="1.5" fill="#06B6D4"/>
  <rect x="16" y="8" width="4" height="4" rx="1" fill="#4F46E5" opacity="0.85"/>
  <path d="M13 21L8 25.5L13 30" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M27 21L32 25.5L27 30" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22.5 18L17.5 32" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round"/>
  ==========================================================================
  -->
  <defs>
    <!-- Gradiente maestro de Azul Eléctrico a Rojo Carmesí -->
    <linearGradient id="pixelBlueToRed" x1="6" y1="40" x2="42" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="25%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="80%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Resplandor sutil para cubos grandes -->
    <filter id="pixelGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3B82F6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fondo Dark Tech -->
  <rect width="48" height="48" rx="12" fill="#0B0F19"/>
  <rect x="1.5" y="1.5" width="45" height="45" rx="10.5" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Matriz de píxeles / cubos degradados: de grandes a pequeños -->
  <!-- 1. Cubo Principal Grande (Base Azul Sólida) -->
  <rect x="8" y="24" width="15" height="15" rx="3.5" fill="#06B6D4" filter="url(#pixelGlow)"/>
  <rect x="10" y="26" width="11" height="11" rx="2" fill="#3B82F6"/>

  <!-- 2. Cubo Mediano-Grande (Transición a Azul/Índigo) -->
  <rect x="8" y="10" width="11" height="11" rx="2.5" fill="#3B82F6"/>

  <!-- 3. Cubo Mediano (Transición Índigo a Violeta) -->
  <rect x="21" y="10" width="9" height="9" rx="2" fill="#8B5CF6"/>

  <!-- 4. Cubo Secundario (Transición Violeta a Magenta) -->
  <rect x="25" y="21" width="8" height="8" rx="2" fill="#A855F7"/>

  <!-- 5. Cubos Pequeños en Dispersión Ascendente (Rosa a Rojo Carmesí) -->
  <rect x="32" y="10" width="6" height="6" rx="1.5" fill="#EC4899"/>
  <rect x="35" y="18" width="5" height="5" rx="1.2" fill="#F43F5E"/>
  <rect x="25" y="31" width="6" height="6" rx="1.5" fill="#8B5CF6" opacity="0.9"/>
  <rect x="33" y="25" width="4.5" height="4.5" rx="1" fill="#EF4444"/>
  <rect x="39" y="12" width="3.5" height="3.5" rx="0.8" fill="#EF4444" opacity="0.95"/>
  <rect x="33" y="32" width="3" height="3" rx="0.8" fill="#F43F5E" opacity="0.8"/>
  <rect x="20" y="5" width="3.5" height="3.5" rx="0.8" fill="#06B6D4" opacity="0.85"/>
</svg>
