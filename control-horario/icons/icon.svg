<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <!-- Outer circle clock -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#334155" stroke-width="24" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#cyanGrad)" stroke-width="24" stroke-dasharray="1068" stroke-dashoffset="350" stroke-linecap="round" />
  <!-- Clock hands -->
  <line x1="256" y1="256" x2="256" y2="150" stroke="#f8fafc" stroke-width="18" stroke-linecap="round" />
  <line x1="256" y1="256" x2="330" y2="256" stroke="#06b6d4" stroke-width="18" stroke-linecap="round" />
  <circle cx="256" cy="256" r="16" fill="#f8fafc" />
  <!-- Checkmark Badge -->
  <circle cx="360" cy="360" r="72" fill="url(#emeraldGrad)" />
  <path d="M334 360 l20 20 l36 -38" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
</svg>
